name: CI/CD

on:
  push:
    branches: [main, 'aws/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopnest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Static checks: PHP syntax, leaked secrets, Terraform
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './infra/*' -print0 | xargs -0 -n1 php -l
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format + validate
        run: |
          terraform -chdir=infra fmt -check -recursive || echo "::warning::Run terraform fmt in infra/"
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  # 2. Functional tests against a real database
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: ecomdb
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, gd
      - name: Load schema and sample data
        run: mysql -h 127.0.0.1 -uroot -proot < ecomdb.sql
      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8080/health.php
      - name: End-to-end tests (customer, seller, admin)
        run: BASE_URL=http://127.0.0.1:8080 python3 tests/e2e.py
      - name: PHP server log
        if: always()
        run: grep -iE "warning|fatal|error" /tmp/php.log || echo "No PHP errors"

  # 3. Build the Docker image and scan it. No cloud credentials are used or needed.
  #    CD is PULL-based: the EC2 server polls GitHub and deploys a commit only after this
  #    whole workflow succeeded for exactly that commit (see deploy/pull/pull-deploy.sh).
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::12} -t shopnest:ci .
      - name: Vulnerability scan with Trivy 0.76.2 (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -e TRIVY_DB_REPOSITORY=mirror.gcr.io/aquasec/trivy-db:2             aquasec/trivy:0.76.2 image --severity CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 shopnest:ci
      - name: Container smoke test (starts, healthy, runs as www-data)
        run: |
          docker network create ci
          docker run -d --name db --network ci -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=ecomdb mariadb:11
          docker run -d --name app --network ci -e DB_HOST=db -e DB_USER=root -e DB_PASS=root -e DB_NAME=ecomdb shopnest:ci
          for i in $(seq 1 40); do curl -fs "http://$(docker inspect -f '{{(index .NetworkSettings.Networks "ci").IPAddress}}' app)/health.php" | grep -q '"status":"ok"' && break; sleep 3; done
          curl -fsS "http://$(docker inspect -f '{{(index .NetworkSettings.Networks "ci").IPAddress}}' app)/health.php"
          docker exec app ps -eo user | grep -q www-data
          ! docker exec app sh -c 'ls /var/www/html | grep -E "^(infra|tests|deploy|.env)$"'
