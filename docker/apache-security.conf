# Security headers and hardening for ShopNest
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# Real client IP from the Caddy reverse proxy
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
# Never serve the SQL dump, dot-files or Markdown docs
<FilesMatch "(\.sql|\.md|\.env.*|\.git.*)$">
    Require all denied
</FilesMatch>
# Uploaded images: never execute PHP there
<Directory /var/www/html/images>
    php_admin_flag engine off
    Options -Indexes
</Directory>
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>
